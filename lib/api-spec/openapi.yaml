openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Cohort — AI agent fleet governance API
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: fleet
    description: Fleet-level overview and alerts
  - name: performance
    description: KPI contracts, taxonomy and operational insight rules
  - name: agents
    description: Agent registry, identity, evaluation and verdicts
  - name: connectors
    description: Platform connectors (plug and play)
  - name: organizations
    description: Authenticated organization discovery and tenant provisioning
  - name: telemetry
    description: Continuous telemetry activity, projections and supervision
  - name: executive-reporting
    description: Versioned monthly executive reporting and AI-assisted narratives
  - name: access-control
    description: Tenant-scoped access groups, members and contextual permissions
  - name: realtime-governance
    description: Continuous Direction, Protection, Proof, regression and grounding assessments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /healthz/worker:
    get:
      operationId: getContinuousTelemetryHealth
      tags: [health, telemetry]
      summary: Continuous telemetry worker and queue health
      description: Returns aggregate queue diagnostics without tenant identifiers or payloads.
      security: []
      responses:
        "200":
          description: Worker and queue are within their operational targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuousTelemetryHealth"
        "503":
          description: Worker, queue or database is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuousTelemetryHealth"

  /telemetry/activity:
    get:
      operationId: listContinuousTelemetryActivity
      tags: [telemetry]
      summary: List durable telemetry and projection activity
      description: Returns tenant-scoped outbox activity after an optional durable cursor.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Tenant-scoped continuous activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuousTelemetryActivityResponse"

  /telemetry/activity/stream:
    get:
      operationId: streamContinuousTelemetryActivity
      tags: [telemetry]
      summary: Stream durable telemetry and projection activity
      description: Resumes after Last-Event-ID or the after query cursor and emits SSE activity messages.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-sent activity event stream
          content:
            text/event-stream:
              schema:
                type: string

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations available to the authenticated user
      description: Returns Clerk organization memberships enriched with their local provisioning status.
      responses:
        "200":
          description: Organizations visible to the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /organizations/active/sync:
    post:
      operationId: syncActiveOrganization
      tags: [organizations]
      summary: Provision and synchronize the active organization
      description: Uses the active Clerk organization claim and membership to provision the tenant and its default catalog. Request body values are intentionally ignored.
      responses:
        "200":
          description: Active organization synchronized successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveOrganizationSyncResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The active organization is not a membership of the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationError"
        "409":
          description: No active organization was selected in Clerk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationError"

  /fleet/summary:
    get:
      operationId: getFleetSummary
      tags: [fleet]
      summary: Fleet summary
      description: Consolidated cohort overview for the home dashboard
      responses:
        "200":
          description: Fleet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetSummary"

  /fleet/kpis:
    get:
      operationId: getFleetKpis
      tags: [fleet]
      summary: Fleet KPI analytics
      description: Aggregated 5-layer KPI analytics, trends, ROI and rankings across the whole fleet
      responses:
        "200":
          description: Fleet KPI analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetKpis"

  /fleet/insights:
    get:
      operationId: getFleetInsights
      tags: [fleet]
      summary: Prioritized operational insights
      description: Deterministic operational score, freshness, confidence, trend and prioritized recommendations for the fleet.
      responses:
        "200":
          description: Fleet operational insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetInsights"

  /executive-reports/monthly:
    get:
      operationId: listExecutiveReports
      tags: [executive-reporting]
      summary: List monthly executive report snapshots
      description: Returns the latest version of each tenant-scoped monthly report.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 12
      responses:
        "200":
          description: Latest monthly report versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveReportList"

  /executive-reports/monthly/generate:
    post:
      operationId: generateExecutiveReport
      tags: [executive-reporting]
      summary: Generate and persist a monthly executive report
      description: Calculates immutable metrics first and optionally enriches only narrative fields with AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateExecutiveReportRequest"
      responses:
        "201":
          description: Versioned report snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveReport"

  /executive-reports/monthly/{period}:
    get:
      operationId: getExecutiveReport
      tags: [executive-reporting]
      summary: Get the latest executive report for a month
      parameters:
        - name: period
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Latest report version for the requested month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveReport"
        "404":
          description: No persisted report for the month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /performance/kpi-contracts:
    get:
      operationId: listKpiContracts
      tags: [performance]
      summary: List operational KPI contracts
      description: Returns additive code-defined KPI contracts without requiring metric schema changes.
      responses:
        "200":
          description: KPI contract catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiContractsResponse"

  /performance/kpi-contracts/{domain}:
    get:
      operationId: listKpiContractsByDomain
      tags: [performance]
      summary: List KPI contracts by domain
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/KpiDomain"
      responses:
        "200":
          description: KPI contracts for the selected domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDomainContractsResponse"
        "404":
          description: KPI domain not found

  /performance/kpi-taxonomy:
    get:
      operationId: getKpiTaxonomy
      tags: [performance]
      summary: Get KPI capability taxonomy and adoption rules
      responses:
        "200":
          description: KPI taxonomy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiTaxonomy"

  /fleet/decisions:
    get:
      operationId: listFleetDecisions
      tags: [fleet]
      summary: Fleet-wide verdict decisions
      description: Pending and decided committee verdicts across the whole fleet, for the command home and audit trail.
      responses:
        "200":
          description: Fleet decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetDecision"

  /fleet/governance:
    get:
      operationId: getFleetGovernance
      tags: [fleet]
      summary: Fleet governance overview
      description: Compliance summary, responsibility chain grouped by business owner and audit trail.
      responses:
        "200":
          description: Fleet governance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetGovernance"

  /fleet/benchmarks:
    get:
      operationId: getFleetBenchmarks
      tags: [fleet]
      summary: Fleet benchmarks
      description: ROI and accuracy rankings across the whole fleet.
      responses:
        "200":
          description: Fleet benchmarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetBenchmarks"

  /fleet/alerts:
    get:
      operationId: listFleetAlerts
      tags: [fleet]
      summary: Active fleet alerts
      description: Illusory-victory detector alerts across the whole fleet
      parameters:
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, antecedent]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, acknowledged, resolved]
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /fleet/alerts/{alertId}:
    patch:
      operationId: updateFleetAlert
      tags: [fleet]
      summary: Update an alert operational state
      description: Assign an owner, set a due date, acknowledge or resolve an alert.
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFleetAlertInput"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      parameters:
        - name: area
          in: query
          required: false
          description: Id da área, ou "none" para os agentes ainda sem área atribuída.
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [observation, active, flagged, retiring, retired]
        - name: verdict
          in: query
          required: false
          schema:
            type: string
            enum: [promote, mentor, retire, observation]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, stable]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Admit a new agent (Carteira de Trabalho)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Agent admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: Lista as áreas da organização com o resumo da frota de cada uma
      responses:
        "200":
          description: Áreas da organização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaList"
    post:
      operationId: createArea
      tags: [areas]
      summary: Cria uma área dentro da organização
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaInput"
      responses:
        "201":
          description: Área criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "409":
          description: Já existe área com esse nome na organização

  /areas/{areaId}:
    patch:
      operationId: updateArea
      tags: [areas]
      summary: Atualiza nome, responsável ou centro de custo da área
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaInput"
      responses:
        "200":
          description: Área atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
        "404":
          description: Área não encontrada
    delete:
      operationId: deleteArea
      tags: [areas]
      summary: Remove a área; os agentes dela voltam a ficar sem área
      description: >-
        Os agentes NÃO são apagados junto — voltam para "sem área". Perder o
        recorte organizacional não pode significar perder o agente.
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Área removida
        "404":
          description: Área não encontrada

  /agents/{agentId}/area:
    patch:
      operationId: assignAgentArea
      tags: [areas]
      summary: Atribui (ou remove) a área responsável pelo agente
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAreaInput"
      responses:
        "200":
          description: Atribuição registrada
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                  areaId:
                    type: string
                    nullable: true
        "400":
          description: Área inexistente nesta organização
        "404":
          description: Agente não encontrado

  /discovery/analyze:
    post:
      operationId: analyzeAgentSource
      tags: [agents]
      summary: Analyze pasted agent code and skills into an editable draft
      description: >-
        Uses an AI model to read the agent's code and skill definitions and
        propose a persona, Carteira de Trabalho and 5-layer KPI metrics. The
        result is an editable draft and is not persisted until admission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeSourceInput"
      responses:
        "200":
          description: Draft generated from the provided source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDraft"

  /discovery/fetch:
    post:
      operationId: fetchAgentSource
      tags: [agents]
      summary: Fetch agent source from a Git repository or web URL
      description: >-
        Fetches and concatenates the relevant source and skill files from a
        Git repository (e.g. GitHub) or a single web/raw URL, applying size and
        file-type guardrails. Private GitHub repositories are supported when a
        GitHub credential is available through GITHUB_TOKEN, GH_TOKEN, or
        GITHUB_ACCESS_TOKEN; otherwise only public repos are accessible. The
        concatenated text can then be passed to the analyze endpoint. Nothing is
        persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchSourceInput"
      responses:
        "200":
          description: Source fetched and concatenated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchSourceResult"

  /discovery/github-status:
    get:
      operationId: getGitHubStatus
      tags: [agents]
      summary: Report whether a GitHub credential is available for private imports
      description: >-
        Read-only check that reports whether a GitHub credential is currently
        resolvable from the GITHUB_TOKEN, GH_TOKEN, or GITHUB_ACCESS_TOKEN
        environment variables, without ever exposing the token. Used by the
        import screen to show the connection status before attempting a
        private-repo import.
      responses:
        "200":
          description: GitHub connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubStatus"

  /discovery/runs:
    post:
      operationId: startDiscoveryRun
      tags: [agents]
      summary: Start a mass-discovery run
      description: >-
        Opens a discovery run that groups the agents found from a source
        (connector platform, GitHub org, etc.) and stages them as editable
        drafts before any admission. The rich rule-based / AI enrichment is
        performed by separate workers; this endpoint persists the run and the
        bare staged drafts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDiscoveryRunInput"
      responses:
        "201":
          description: Discovery run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryRun"

  /discovery/runs/{runId}:
    get:
      operationId: getDiscoveryRun
      tags: [agents]
      summary: Get a discovery run with progress counts
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Discovery run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /discovery/drafts:
    get:
      operationId: listAgentDrafts
      tags: [agents]
      summary: List staged agent drafts with filters
      parameters:
        - name: runId
          in: query
          required: false
          schema:
            type: string
        - name: reviewStatus
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: enrichmentStatus
          in: query
          required: false
          schema:
            type: string
            enum: [pending, rules, enriching, enriched, failed]
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: minConfidence
          in: query
          required: false
          schema:
            type: number
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Staged drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentDraftRecord"

  /discovery/drafts/bulk-approve:
    post:
      operationId: bulkApproveAgentDrafts
      tags: [agents]
      summary: Approve multiple drafts (promote to fleet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDraftIdsInput"
      responses:
        "200":
          description: Bulk approval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkReviewResult"

  /discovery/drafts/bulk-reject:
    post:
      operationId: bulkRejectAgentDrafts
      tags: [agents]
      summary: Reject multiple drafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDraftIdsInput"
      responses:
        "200":
          description: Bulk rejection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkReviewResult"

  /discovery/drafts/{draftId}:
    patch:
      operationId: updateAgentDraft
      tags: [agents]
      summary: Edit a staged draft before review
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDraftUpdate"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDraftRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /discovery/drafts/{draftId}/approve:
    post:
      operationId: approveAgentDraft
      tags: [agents]
      summary: Approve a draft and promote it to the fleet
      description: >-
        Promotes the draft into the real fleet reusing the standard agent
        admission path (Carteira de Trabalho + seeded initial evaluation), then
        marks the draft as approved and links it to the created agent.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Agent admitted from draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Draft already reviewed or agent already admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /discovery/drafts/{draftId}/reject:
    post:
      operationId: rejectAgentDraft
      tags: [agents]
      summary: Reject a draft without touching the fleet
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectDraftInput"
      responses:
        "200":
          description: Rejected draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDraftRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /agents/{agentId}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get a single agent with full work record
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent core fields
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Retire and remove an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /agents/{agentId}/identity:
    patch:
      operationId: updateAgentIdentity
      tags: [agents]
      summary: Update the agent work record (identity)
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityUpdate"
      responses:
        "200":
          description: Updated agent detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"

  /agents/{agentId}/evaluations:
    get:
      operationId: listAgentEvaluations
      tags: [agents]
      summary: Evaluation history for an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
