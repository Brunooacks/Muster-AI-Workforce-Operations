components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Clerk session token for humans or a revocable Muster agent API key on machine-ingestion routes.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
          description: Version declared by the API server package.
        sha:
          type: string
          description: Git SHA embedded in the production image build.
      required:
        - status
        - version
        - sha

    ContinuousTelemetryWorkerDiagnostics:
      type: object
      required:
        - enabled
        - running
        - startedAt
        - lastPollAt
        - lastSuccessAt
        - lastErrorAt
        - processed
        - failed
        - deadLettered
        - reclaimed
      properties:
        enabled: { type: boolean }
        running: { type: boolean }
        startedAt: { type: [string, "null"], format: date-time }
        lastPollAt: { type: [string, "null"], format: date-time }
        lastSuccessAt: { type: [string, "null"], format: date-time }
        lastErrorAt: { type: [string, "null"], format: date-time }
        processed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        deadLettered: { type: integer, minimum: 0 }
        reclaimed: { type: integer, minimum: 0 }

    ContinuousTelemetryQueueHealth:
      type: object
      required: [pending, processing, deadLetter, oldestPendingAgeSeconds]
      properties:
        pending: { type: integer, minimum: 0 }
        processing: { type: integer, minimum: 0 }
        deadLetter: { type: integer, minimum: 0 }
        oldestPendingAgeSeconds: { type: [number, "null"], minimum: 0 }

    ContinuousTelemetryHealth:
      type: object
      required: [status, worker, queue]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        worker:
          $ref: "#/components/schemas/ContinuousTelemetryWorkerDiagnostics"
        queue:
          oneOf:
            - $ref: "#/components/schemas/ContinuousTelemetryQueueHealth"
            - type: "null"

    ContinuousTelemetryActivity:
      type: object
      required:
        - id
        - aggregateType
        - aggregateId
        - eventType
        - payload
        - priority
        - status
        - attempts
        - availableAt
        - processedAt
        - lastError
        - createdAt
      properties:
        id: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        eventType: { type: string }
        payload:
          type: object
          additionalProperties: true
        priority:
          type: string
          enum: [critical, high, normal, low]
        status:
          type: string
          enum: [pending, processing, completed, dead-letter]
        attempts: { type: integer, minimum: 0 }
        availableAt: { type: string, format: date-time }
        processedAt: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    ContinuousTelemetryFreshness:
      type: object
      required: [serverTime, pollingRecommendedMs, projectionTargetSeconds]
      properties:
        serverTime: { type: string, format: date-time }
        pollingRecommendedMs: { type: integer, minimum: 1 }
        projectionTargetSeconds: { type: integer, minimum: 1 }

    ContinuousTelemetryActivityResponse:
      type: object
      required: [items, nextCursor, freshness]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContinuousTelemetryActivity"
        nextCursor: { type: [string, "null"] }
        freshness:
          $ref: "#/components/schemas/ContinuousTelemetryFreshness"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    OrganizationRole:
      type: string
      enum: [owner, admin, member]

    OrganizationSummary:
      type: object
      required:
        - id
        - externalId
        - name
        - slug
        - role
        - providerRole
        - active
        - provisioned
      properties:
        id:
          type: [string, "null"]
        externalId:
          type: string
        name:
          type: string
        slug:
          type: string
        role:
          $ref: "#/components/schemas/OrganizationRole"
        providerRole:
          type: string
        active:
          type: boolean
        provisioned:
          type: boolean

    OrganizationList:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationSummary"

    ProvisionedOrganization:
      type: object
