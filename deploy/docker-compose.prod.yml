name: muster

services:
  postgres:
    image: postgres:16-alpine
    env_file: ${MUSTER_ENV_FILE:-/opt/muster/.env.production}
    environment:
      POSTGRES_DB: muster
      POSTGRES_USER: muster
    volumes:
      - muster-postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster -d muster"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    networks:
      - muster-internal

  muster:
    image: ghcr.io/brunooacks/muster:${MUSTER_IMAGE_TAG:?MUSTER_IMAGE_TAG is required}
    env_file: ${MUSTER_ENV_FILE:-/opt/muster/.env.production}
    ports:
      - "127.0.0.1:${MUSTER_PUBLIC_PORT:-8081}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      MIGRATE_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    networks:
      - muster-internal

volumes:
  muster-postgres-data:
    name: muster-postgres-data

networks:
  muster-internal:
    name: muster-internal
