name: muster

services:
  postgres:
    image: postgres:16-alpine
    env_file: ${MUSTER_ENV_FILE:-/opt/muster/.env.production}
    environment:
      POSTGRES_DB: muster
      POSTGRES_USER: muster
    # Ajuste para caber em 256 MiB sem disputar memória com o Veltrix.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    volumes:
      - muster-postgres-data:/var/lib/postgresql/data
    # Limites rígidos: o droplet é compartilhado com o Veltrix (2 vCPU, 4 GiB,
    # sem swap). Se faltar memória, o kernel deve matar o Muster antes do
    # Veltrix (oom_score_adj positivo). Ver docs/PRODUCAO-INFRA.md.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 200
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster -d muster"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    networks:
      - muster-internal

  muster:
    image: ghcr.io/brunooacks/muster:${MUSTER_IMAGE_TAG:?MUSTER_IMAGE_TAG is required}
    env_file: ${MUSTER_ENV_FILE:-/opt/muster/.env.production}
    ports:
      - "127.0.0.1:${MUSTER_PUBLIC_PORT:-8081}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      MIGRATE_ON_START: "true"
      # Heap do Node abaixo do limite do container: falha com erro claro em
      # vez de ser morto pelo OOM killer no meio de uma requisição.
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 256
    oom_score_adj: 500
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    networks:
      - muster-internal

volumes:
  muster-postgres-data:
    name: muster-postgres-data

networks:
  muster-internal:
    name: muster-internal
