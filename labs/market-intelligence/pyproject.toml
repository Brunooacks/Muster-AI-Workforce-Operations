[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cenyra-market-intelligence"
version = "0.1.0"
description = "Agentes para inteligência contínua e comparável de mercado"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agno==2.8.7",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "crewai==1.15.16",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "langchain==1.3.15",
  "langchain-openai>=1.0,<2",
  "openai>=2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.35,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7"]

[project.scripts]
market-lab = "market_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
