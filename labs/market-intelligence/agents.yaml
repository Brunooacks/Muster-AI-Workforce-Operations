version: 1
laboratory: market-intelligence
integration_status: isolated
agents:
  - id: radar-melhor-lance
    name: Radar Melhor Lance
    framework: LangChain
    source: https://www.melhorlance.dev/
    purpose: Documentar diariamente produtos brasileiros que compram atenção e identificar padrões de demanda.
    routine: daily
    schedule: "02:30 America/Sao_Paulo"
    responsibilities:
      - coletar ranking, produto, descrição, links, cliques e valor pago
      - classificar dores, público, tema, retorno e complexidade
      - preservar evidências e histórico diário
    sla:
      freshness_hours: 26
      minimum_success_rate: 0.95
      maximum_runtime_minutes: 10
    kpis:
      - extraction_success_rate
      - records_discovered
      - links_discovered
      - price_coverage
      - ranking_coverage
      - enrichment_coverage
      - source_change_rate
      - duration_ms
      - token_cost_usd

  - id: outbid-global-scout
    name: Outbid Global Scout
    framework: CrewAI
    source: https://outbid.lol/
    purpose: Acompanhar o mercado global de atenção paga e detectar categorias, produtos e narrativas emergentes.
    routine: daily
    schedule: "02:30 America/Sao_Paulo"
    responsibilities:
      - coletar ranking, categoria, valor em dólar, cliques, descrição e referências
      - traduzir títulos, resumos e contexto internacional para português brasileiro
      - comparar concentração de capital e atenção
      - produzir dossiê de oportunidade, comprador, captura de valor, MVP, GTM e riscos
    sla:
      freshness_hours: 26
      minimum_success_rate: 0.95
      maximum_runtime_minutes: 12
    kpis:
      - extraction_success_rate
      - records_discovered
      - links_discovered
      - category_coverage
      - price_coverage
      - click_coverage
      - enrichment_coverage
      - translation_coverage
      - business_detail_coverage
      - market_research_coverage
      - duration_ms
      - token_cost_usd

  - id: yc-rfs-opportunity-miner
    name: YC RFS Opportunity Miner
    framework: Agno
    source: https://www.ycombinator.com/rfs
    purpose: Transformar Requests for Startups em problemas rastreáveis, comparáveis e pesquisáveis por estação e autoria.
    routine: daily
    schedule: "02:30 America/Sao_Paulo"
    responsibilities:
      - coletar todas as estações, ideias, autores e referências
      - traduzir integralmente títulos, sínteses e contexto para português brasileiro
      - pesquisar alternativas existentes quando Tavily estiver configurado
      - detalhar potencial de negócio, comprador, MVP, validação, GTM e riscos
      - ranquear potencial de negócio versus complexidade de validação
    sla:
      freshness_hours: 26
      minimum_success_rate: 0.95
      maximum_runtime_minutes: 15
    kpis:
      - extraction_success_rate
      - season_coverage
      - author_coverage
      - reference_coverage
      - market_research_coverage
      - enrichment_coverage
      - translation_coverage
      - business_detail_coverage
      - duration_ms
      - token_cost_usd

  - id: cenyra-synthesizer
    name: Cenyra Synthesizer
    framework: deterministic-orchestrator
    purpose: Consolidar as três fontes em um relatório diário interativo, auditável e orientado a experimentos.
    routine: after_collectors
    responsibilities:
      - normalizar scores entre fontes heterogêneas
      - gerar portfólio, temas, recomendações, traduções e dossiês de negócio
      - publicar API, dashboard e métricas Prometheus
    sla:
      freshness_hours: 27
      minimum_success_rate: 0.98
      maximum_runtime_minutes: 3
    kpis:
      - report_completion_rate
      - opportunity_count
      - evidence_link_count
      - high_signal_low_complexity_count
      - source_coverage
      - report_freshness_hours
