name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character Git SHA to deploy
        required: true
        type: string

concurrency:
  group: muster-deploy
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ vars.MUSTER_DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve target SHA
        id: target
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a lowercase 40-character Git SHA." >&2
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail closed: the SPA is built invite-only unless the repository
      # variable VITE_MUSTER_INVITE_ONLY is explicitly "false". Unset or
      # malformed values never open public sign-up.
      - name: Resolve SPA access flags
        id: spa
        env:
          INVITE_ONLY: ${{ vars.VITE_MUSTER_INVITE_ONLY }}
        run: |
          value="$(printf '%s' "$INVITE_ONLY" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$value" = "false" ]; then
            echo "invite_only=false" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$value" ] && [ "$value" != "true" ]; then
              echo "::warning::VITE_MUSTER_INVITE_ONLY is neither true nor false; building invite-only."
            fi
            echo "invite_only=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/brunooacks/muster:sha-${{ steps.target.outputs.sha }}
          build-args: |
            GIT_SHA=${{ steps.target.outputs.sha }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_MUSTER_INVITE_ONLY=${{ steps.spa.outputs.invite_only }}
            VITE_MUSTER_CONTACT_URL=${{ vars.VITE_MUSTER_CONTACT_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Deploy the immutable image over SSH
        env:
          MUSTER_DEPLOY_HOST: ${{ secrets.MUSTER_DEPLOY_HOST }}
          MUSTER_DEPLOY_USER: ${{ secrets.MUSTER_DEPLOY_USER }}
          MUSTER_DEPLOY_SSH_KEY: ${{ secrets.MUSTER_DEPLOY_SSH_KEY }}
          MUSTER_DEPLOY_KNOWN_HOSTS: ${{ secrets.MUSTER_DEPLOY_KNOWN_HOSTS }}
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/muster-deploy-key"
          hosts_file="$RUNNER_TEMP/muster-known-hosts"
          printf '%s\n' "$MUSTER_DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$MUSTER_DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" \
            "$MUSTER_DEPLOY_USER@$MUSTER_DEPLOY_HOST" \
            "cd /opt/muster && ./deploy/remote-deploy.sh '$TARGET_SHA'"
