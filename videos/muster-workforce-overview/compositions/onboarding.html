      document.getElementById(id).textContent = value;

    const targetY = -40 - (100 - variables.focusY) * 6.05;
    const activeStage = { color: "#075f58", backgroundColor: "#d9f0eb", boxShadow: "inset 0 0 0 1px rgba(7,119,111,.24)" };

    timeline.fromTo(".narrative", { x: -54, opacity: 0 }, { x: 0, opacity: 1, duration: .8, ease: "power4.out" }, .45);
