services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: muster
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - muster-release-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster -d muster"]
      interval: 5s
      timeout: 5s
      retries: 12

  muster:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Configure VITE_CLERK_PUBLISHABLE_KEY}
        VITE_MUSTER_INVITE_ONLY: ${VITE_MUSTER_INVITE_ONLY:-false}
        VITE_MUSTER_CONTACT_URL: ${VITE_MUSTER_CONTACT_URL:-}
    restart: unless-stopped
    ports:
      - "${MUSTER_PUBLIC_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://muster:${POSTGRES_PASSWORD}@postgres:5432/muster
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Configure CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Configure CLERK_PUBLISHABLE_KEY}
      MUSTER_CREDENTIAL_ENCRYPTION_KEY: ${MUSTER_CREDENTIAL_ENCRYPTION_KEY:?Configure MUSTER_CREDENTIAL_ENCRYPTION_KEY}
      MUSTER_INVITE_ONLY: ${MUSTER_INVITE_ONLY:-false}
      MIGRATE_ON_START: "true"
      CONTINUOUS_TELEMETRY_WORKER_ENABLED: "true"
      ALLOW_SEEDED_EVALUATIONS: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  muster-release-postgres:
